# Home Assistant add-on definition. Add https://github.com/coffeec0der/vibed-closet
# as an add-on repository in Home Assistant. GitHub Actions builds the image
# and bumps `version` on every change to main; don't edit it by hand.
name: Libre Closet (vibed)
version: "0.9.4"
slug: libre_closet
description: Self-hosted wardrobe organizer with local AI try-on (vibed-closet)
url: https://github.com/coffeec0der/vibed-closet
arch:
  - amd64
# Prebuilt by .github/workflows/ha-addon.yml; Home Assistant just downloads it.
image: "ghcr.io/coffeec0der/{arch}-vibed-closet"
startup: application
boot: auto
init: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Web interface
webui: "http://[HOST]:[PORT:3000]"
# The try-on runtime and models (6-7 GB) can be re-downloaded; keep them out
# of Home Assistant backups.
backup_exclude:
  - "tryon/**"
  - "**/tryon/**"
# Login is off by default: with it on, items added while it was off (owned by
# nobody) are hidden. Turn it on deliberately; see README "Home Assistant".
options:
  auth_enabled: false
  disable_registration: false
  currency: EUR
  weather_enabled: true
schema:
  auth_enabled: bool
  disable_registration: bool
  currency: str
  weather_enabled: bool
  app_name: str?
